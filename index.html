<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ENI ASR — Cursus Administrateur Systèmes et Réseaux (2 Ans)</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Portail de documentation et base de connaissances sur 2 ans du cursus Administrateur Systèmes et Réseaux de l'ENI.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Theme: Docsify Themeable -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  
  <!-- Sidebar Collapse Plugin CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />

  <style>
    :root {
      /* Typography */
      --base-font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --code-font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      --base-font-size: 15px;
      --base-line-height: 1.65;

      /* Dark Palette */
      --theme-color: #3b82f6;
      --base-background-color: #090d16;
      --content-max-width: 980px;

      /* Sidebar */
      --sidebar-width: 310px;
      --sidebar-background: #0f172a;
      --sidebar-border-color: #1e293b;
      --sidebar-nav-link-color: #94a3b8;
      --sidebar-nav-link-color--active: #60a5fa;
      --sidebar-nav-link-font-weight--active: 600;
      --sidebar-nav-link-color--hover: #f1f5f9;

      /* Code Blocks */
      --code-theme-background: #030712;
      --code-theme-text: #e2e8f0;
      --code-inline-background: #1e293b;
      --code-inline-color: #93c5fd;

      /* Tables & Borders */
      --table-cell-border-color: #1e293b;
      --table-head-border-color: #334155;
      --table-head-background: #1e293b;
      --hr-border-color: #1e293b;
      --blockquote-border-color: #3b82f6;
    }

    /* Navbar Modern Styling */
    .app-nav {
      margin: 18px 30px 0 0;
    }
    .app-nav li {
      font-size: 13px;
      font-weight: 500;
    }
    .app-nav a {
      color: #94a3b8 !important;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .app-nav a:hover {
      color: #ffffff !important;
      background: #1e293b;
    }

    /* Sidebar Header & Brand */
    .app-name-link {
      font-weight: 800 !important;
      font-size: 1.15rem !important;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      padding: 10px 0;
      display: block;
    }

    /* Modern Card Grids in Markdown */
    .hub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
      margin: 1.5rem 0 2.5rem 0;
    }

    .hub-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 1.25rem;
      transition: all 0.2s ease-in-out;
      text-decoration: none !important;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hub-card:hover {
      border-color: #3b82f6;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15);
    }

    .hub-card-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: #f8fafc !important;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .hub-card-desc {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 1rem;
    }

    .hub-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #1e293b;
      padding-top: 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: #60a5fa;
    }

    /* Tag Badges */
    .tag {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .tag-blue { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
    .tag-green { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
    .tag-purple { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.3); }
    .tag-amber { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }

    /* Search Input Styling */
    .sidebar .search input {
      border: 1px solid #334155;
      background: #090d16;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 13px;
      padding: 8px 12px;
    }
    .sidebar .search input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
  </style>
</head>
<body>
  <div id="app">Chargement du portail ASR...</div>

  <script>
    window.$docsify = {
      name: '🎓 ENI ASR (2 Ans)',
      repo: 'https://github.com/icare0/eni-asr',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      
      // Sidebar Collapse Plugin Config: fold everything except current level
      sidebarDisplayLevel: 1,

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Rechercher un cours, un TP, une commande...',
        noData: 'Aucun résultat trouvé.',
        depth: 4
      },

      copyCode: {
        buttonText: 'Copier',
        errorText: 'Erreur',
        successText: 'Copié !'
      },

      pagination: {
        previousText: 'Chapitre précédent',
        nextText: 'Chapitre suivant',
        crossChapter: true,
        crossChapterText: true,
      }
    }
  </script>

  <!-- Docsify Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>

  <!-- Sidebar Collapse Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>

  <!-- Search & Copy & Pagination Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>

  <!-- Prism Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-batch.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
</body>
</html>
