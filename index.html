<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ENI ASR — Cursus Administrateur Systèmes et Réseaux</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Base de connaissances et documentation complète sur 2 ans du cursus Administrateur Systèmes et Réseaux (ASR) de l'ENI.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Theme: Themeable or Standard Dark/Light -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  
  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #2563eb;
      --sidebar-width: 320px;
      --sidebar-nav-link-color: #374151;
      --sidebar-nav-link-color--active: #2563eb;
      --code-font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      --code-theme-background: #1e293b;
      --code-theme-text: #f8fafc;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .markdown-section {
      max-width: 960px;
      padding: 30px 40px;
    }

    .markdown-section pre>code {
      border-radius: 8px;
      font-size: 0.9em;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-blue { background: #dbeafe; color: #1e40af; }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-amber { background: #fef3c7; color: #92400e; }
    .badge-purple { background: #f3e8ff; color: #6b21a8; }

    /* Custom callout boxes */
    .callout {
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
      border-left: 4px solid #2563eb;
      background: #eff6ff;
      border-radius: 0 8px 8px 0;
    }
    .callout-title {
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: #1e40af;
    }
    .callout-warning {
      border-color: #f59e0b;
      background: #fffbeb;
    }
    .callout-warning .callout-title {
      color: #b45309;
    }
    .callout-success {
      border-color: #10b981;
      background: #f0fdf4;
    }
    .callout-success .callout-title {
      color: #047857;
    }
  </style>
</head>
<body>
  <div id="app">Chargement de la documentation ASR...</div>
  
  <script>
    window.$docsify = {
      name: 'ENI ASR (2 Ans)',
      repo: 'https://github.com/icare0/eni-asr',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Rechercher un concept, une commande...',
        noData: 'Aucun résultat trouvé.',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copier',
        errorText: 'Erreur',
        successText: 'Copié !'
      },
      pagination: {
        previousText: 'Chapitre précédent',
        nextText: 'Chapitre suivant',
        crossChapter: true,
        crossChapterText: true,
      }
    }
  </script>
  
  <!-- Core Docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  
  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  
  <!-- Prism Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-batch.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
</body>
</html>
