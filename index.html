<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Documentation ASR — Administrateur Systèmes & Réseaux</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentation technique et fiches pratiques pour le cursus ASR de l'ENI.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Polices : Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Base Theme Docsify -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <!-- Sidebar Collapse Plugin CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />

  <style>
    /* THEME SYSTEME SOMBRE HAUT CONTRASTE (STYLE DOC TECHNIQUE MODERNE) */
    :root {
      --bg-content: #090d16;
      --bg-sidebar: #0f172a;
      --border: #1e293b;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --heading: #ffffff;
      --link: #38bdf8;
      --code-bg: #030712;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-content) !important;
      color: var(--text) !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      font-size: 15px !important;
      line-height: 1.7 !important;
      margin: 0 !important;
    }

    /* Supprimer tout ruban GitHub en haut à droite */
    .github-corner {
      display: none !important;
    }

    /* Titres */
    h1, h2, h3, h4, h5, h6 {
      color: var(--heading) !important;
      font-weight: 700 !important;
      letter-spacing: -0.015em !important;
    }
    h1 {
      font-size: 1.95rem !important;
      border-bottom: 1px solid var(--border) !important;
      padding-bottom: 0.6rem !important;
      margin-top: 0 !important;
      margin-bottom: 1.5rem !important;
    }
    h2 {
      font-size: 1.4rem !important;
      border-bottom: 1px solid var(--border) !important;
      padding-bottom: 0.4rem !important;
      margin-top: 2.2rem !important;
      margin-bottom: 1rem !important;
    }
    h3 {
      font-size: 1.15rem !important;
      margin-top: 1.6rem !important;
      color: #7dd3fc !important;
    }

    /* Liens */
    a {
      color: var(--link) !important;
      text-decoration: none !important;
      transition: color 0.15s ease !important;
    }
    a:hover {
      text-decoration: underline !important;
      color: #7dd3fc !important;
    }

    /* Zone de contenu principale */
    .content {
      padding-top: 0 !important;
      position: relative !important;
      left: 300px !important;
      max-width: calc(100% - 300px) !important;
    }
    .markdown-section {
      max-width: 960px !important;
      padding: 40px 45px 80px 45px !important;
      margin: 0 auto !important;
    }
    .markdown-section p, .markdown-section li {
      color: #cbd5e1 !important;
      font-size: 0.95rem !important;
    }
    .markdown-section strong {
      color: #ffffff !important;
      font-weight: 600 !important;
    }

    /* SIDEBAR */
    .sidebar {
      background-color: var(--bg-sidebar) !important;
      border-right: 1px solid var(--border) !important;
      width: 300px !important;
      padding: 0 !important;
      overflow-y: auto !important;
    }
    .sidebar-nav {
      padding: 0 16px 30px 16px !important;
    }
    .sidebar-nav ul {
      margin: 0 !important;
      padding-left: 10px !important;
    }
    .sidebar-nav li {
      margin: 3px 0 !important;
      font-size: 13.5px !important;
    }
    .sidebar-nav a {
      color: var(--text-muted) !important;
      font-size: 13.5px !important;
      padding: 6px 10px !important;
      border-radius: 6px !important;
      display: block !important;
      line-height: 1.4 !important;
      text-decoration: none !important;
    }
    .sidebar-nav a:hover {
      color: #ffffff !important;
      background: #1e293b !important;
    }
    .sidebar-nav li.active > a {
      color: #ffffff !important;
      background: #2563eb !important;
      font-weight: 600 !important;
    }

    /* En-tête de la sidebar */
    .app-name {
      padding: 20px 20px 15px 20px !important;
      margin-bottom: 0 !important;
      border-bottom: 1px solid var(--border) !important;
    }
    .app-name-link {
      font-size: 1.05rem !important;
      font-weight: 700 !important;
      color: #ffffff !important;
      text-decoration: none !important;
      display: block !important;
    }

    /* CHAMP DE RECHERCHE INTEGRÉ PRO */
    .sidebar .search {
      padding: 14px 16px !important;
      border-bottom: 1px solid var(--border) !important;
      margin-bottom: 14px !important;
    }
    .sidebar .search input {
      background: #030712 !important;
      border: 1px solid #334155 !important;
      border-radius: 6px !important;
      color: #ffffff !important;
      font-size: 13px !important;
      padding: 8px 12px !important;
      width: 100% !important;
      outline: none !important;
    }
    .sidebar .search input:focus {
      border-color: #38bdf8 !important;
    }
    .sidebar .search .clear-button {
      top: 22px !important;
      right: 24px !important;
    }

    /* CODE BLOCKS */
    .markdown-section pre {
      background: var(--code-bg) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      padding: 1rem 1.25rem !important;
      margin: 1.5rem 0 !important;
    }
    .markdown-section code {
      font-family: 'JetBrains Mono', Consolas, monospace !important;
      font-size: 0.88rem !important;
    }
    .markdown-section p code, .markdown-section li code {
      background: #1e293b !important;
      color: #7dd3fc !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
      border: 1px solid #334155 !important;
    }

    /* TABLEAUX PROPRES SANS SURCHARGE */
    .markdown-section table {
      width: 100% !important;
      border-collapse: collapse !important;
      border: 1px solid var(--border) !important;
      border-radius: 6px !important;
      margin: 1.5rem 0 !important;
    }
    .markdown-section th {
      background: #1e293b !important;
      color: #ffffff !important;
      font-weight: 600 !important;
      font-size: 0.88rem !important;
      padding: 10px 14px !important;
      border-bottom: 1px solid #334155 !important;
      text-align: left !important;
    }
    .markdown-section td {
      padding: 10px 14px !important;
      border-bottom: 1px solid var(--border) !important;
      font-size: 0.88rem !important;
      color: #cbd5e1 !important;
    }
    .markdown-section tr:nth-child(even) td {
      background: rgba(30, 41, 59, 0.25) !important;
    }

    /* ENCADRÉS / CALLOUTS DISCRETS */
    .markdown-section blockquote {
      border-left: 3px solid #38bdf8 !important;
      background: rgba(56, 189, 248, 0.05) !important;
      color: #e2e8f0 !important;
      padding: 0.75rem 1rem !important;
      margin: 1.25rem 0 !important;
      border-radius: 0 6px 6px 0 !important;
    }

    /* BOUTON COPIER */
    .docsify-copy-code-button {
      background: #1e293b !important;
      color: #94a3b8 !important;
      border: 1px solid #334155 !important;
      border-radius: 4px !important;
      font-size: 11px !important;
      padding: 4px 8px !important;
    }
    .docsify-copy-code-button:hover {
      background: #2563eb !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body>
  <div id="app">Chargement...</div>

  <script>
    window.$docsify = {
      name: 'ASR — ENI (2 Ans)',
      loadSidebar: true,
      loadNavbar: false,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',

      sidebarDisplayLevel: 1,

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Rechercher (ex: FSMO, GPO, AGDLP)...',
        noData: 'Aucun résultat.',
        depth: 3
      },

      copyCode: {
        buttonText: 'Copier',
        errorText: 'Erreur',
        successText: 'Copié'
      },

      pagination: {
        previousText: 'Précédent',
        nextText: 'Suivant',
        crossChapter: true,
        crossChapterText: true,
      }
    }
  </script>

  <!-- Docsify Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Sidebar Collapse Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>

  <!-- Search & Copy Code & Pagination Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>

  <!-- Syntax Highlighting with Prism.js -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-batch.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cisco.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
